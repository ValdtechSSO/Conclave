providers:
  claude:
    enabled: true
    command: claude
    promptTransport: stdin
    timeoutSeconds: 360
    maxCostUsd: 0.25
    budget:
      maxTokens: 1000000
      maxDurationMinutes: 15
      maxCalls: 3
      maxCostUsd: 0.25
    proposal:
      model: sonnet
    review:
      model: sonnet
    synthesis:
      model: sonnet
  codex:
    enabled: true
    command: codex
    promptTransport: stdin
    timeoutSeconds: 360
    maxCostUsd: 0.25
    budget:
      maxTokens: 1000000
      maxDurationMinutes: 15
      maxCalls: 3
      maxCostUsd: 0.25
    proposal:
      model: gpt-5.6-sol
    review:
      model: gpt-5.6-sol
    synthesis:
      model: gpt-5.6-sol
  deepseek:
    enabled: true
    command: codex
    promptTransport: stdin
    timeoutSeconds: 600
    maxCostUsd: 0.25
    budget:
      maxTokens: 4000000
      maxDurationMinutes: 30
      maxCalls: 3
      maxCostUsd: 0.25
    proposal:
      model: deepseek-v4-flash
    review:
      model: deepseek-v4-flash
    synthesis:
      model: deepseek-v4-flash
conclave:
  minimumProposalQuorum: 2
  minimumReviewQuorum: 2
synthesis:
  fallback:
    - provider: codex
      model: gpt-5.6-sol
    - provider: claude
      model: sonnet
    - provider: deepseek
      model: deepseek-v4-flash
evidence:
  unverifiablePolicy: annotate
budget:
  run:
    maxDurationMinutes: 45
    maxCalls: 7
    maxCostUsd: 0.50
  provider:
    maxTokens: 1000000
    maxDurationMinutes: 5
    maxCalls: 3
    maxCostUsd: 0.25
  abortOnExceeded: true
retention:
  keepRuns: 20
  maxAgeDays: 30
  keepWorkspaces: false
retry:
  rateLimitAttempts: 0
  timeoutAttempts: 0
  invalidStructuredOutputAttempts: 0
  processCrashAttempts: 0
search:
  maxSuggestedRoots: 20
